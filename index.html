<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#eef4f7" />
  <title>Gary Palfreman — Digital Business Card</title>
  <style>
    :root{
      --bg1:#f6f9fb;
      --bg2:#e8f0f5;
      --ink:#102332;
      --muted:#557080;
      --accent:#1f6f93;
    }
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.95), transparent 30%),
        linear-gradient(135deg,var(--bg1),var(--bg2));
      display:grid;
      place-items:center;
      padding:24px;
    }
    .wrap{
      width:min(100%, 760px);
      display:grid;
      gap:20px;
      justify-items:center;
    }
    .eyebrow{
      letter-spacing:.22em;
      text-transform:uppercase;
      font-size:12px;
      color:var(--muted);
    }
    .scene{
      width:min(92vw, 720px);
      aspect-ratio:85.60/53.98;
      perspective:1600px;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .card{
      position:relative;
      width:100%;
      height:100%;
      transition:transform .22s ease-in-out;
      filter:drop-shadow(0 18px 35px rgba(14,36,52,.18));
    }
    .card.turning{ transform:rotateY(90deg); }
    .card img{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      overflow:hidden;
      border-radius:4.9% / 7.7%;
      background:white;
    }
    .controls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:center;
    }
    button,a.btn{
      appearance:none;
      border:1px solid rgba(16,35,50,.14);
      background:rgba(255,255,255,.85);
      color:var(--ink);
      padding:11px 16px;
      border-radius:999px;
      font:inherit;
      cursor:pointer;
      text-decoration:none;
      backdrop-filter:blur(12px);
      box-shadow:0 6px 18px rgba(16,35,50,.08);
    }
    button:hover,a.btn:hover{border-color:rgba(31,111,147,.35)}
    .hint{
      margin:0;
      color:var(--muted);
      font-size:14px;
      text-align:center;
      line-height:1.5;
    }
    dialog{
      border:0;
      border-radius:20px;
      padding:22px;
      width:min(92vw,420px);
      box-shadow:0 24px 80px rgba(0,0,0,.25);
      color:var(--ink);
    }
    dialog::backdrop{background:rgba(0,0,0,.35);backdrop-filter:blur(4px)}
    #qr{display:block;width:min(260px,100%);height:auto;margin:16px auto 10px;image-rendering:pixelated}
    .url{
      font-size:12px;
      color:var(--muted);
      overflow-wrap:anywhere;
      text-align:center;
    }
    .small{font-size:12px;color:var(--muted)}
    .contact-options{display:grid;gap:12px;margin:20px 0 8px}
    .contact-option{text-align:center}
    @media (prefers-reduced-motion: reduce){
      .card{transition:none}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="eyebrow">Digital Business Card</div>

    <section class="scene" id="scene" aria-label="Tap to flip business card">
      <div class="card" id="card">
        <img id="cardImage" src="front.png" alt="Front of Gary Palfreman business card">
      </div>
    </section>

    <div class="controls">
      <button id="flipBtn" type="button">Flip card</button>
      <button id="qrBtn" type="button">LinkedIn</button>
      <button id="contactBtn" type="button">Contact Gary</button>
    </div>

  </main>

  <script>
    const card = document.getElementById('card');
    const cardImage = document.getElementById('cardImage');
    const scene = document.getElementById('scene');
    const flipBtn = document.getElementById('flipBtn');
    let showingBack = false;
    let flipping = false;

    function flip(){
      if (flipping) return;
      flipping = true;
      card.classList.add('turning');
      setTimeout(() => {
        showingBack = !showingBack;
        cardImage.src = showingBack ? 'back.png' : 'front.png';
        cardImage.alt = showingBack
          ? 'Back of Gary Palfreman business card'
          : 'Front of Gary Palfreman business card';
        card.classList.remove('turning');
      }, 220);
      setTimeout(() => { flipping = false; }, 460);
    }
    scene.addEventListener('click', flip);
    flipBtn.addEventListener('click', flip);

    // One tasteful automatic demonstration only.
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      setTimeout(flip, 1100);
      setTimeout(flip, 2600);
    }

    const dlg = document.getElementById('qrDialog');
    const qrBtn = document.getElementById('qrBtn');
    const closeQr = document.getElementById('closeQr');

    qrBtn.addEventListener('click', () => {
      dlg.showModal();
    });
    closeQr.addEventListener('click', () => dlg.close());

    const contactDlg = document.getElementById('contactDialog');
    const contactBtn = document.getElementById('contactBtn');
    const closeContact = document.getElementById('closeContact');

    contactBtn.addEventListener('click', () => contactDlg.showModal());
    closeContact.addEventListener('click', () => contactDlg.close());
  </script>
